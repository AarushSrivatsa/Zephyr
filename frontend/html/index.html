<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Signed-in visitors never see the marketing page — bounce them to the
     dashboard before anything paints. Reads the same localStorage key
     api.ts uses, so it needs no bundle/module load to decide. -->
<script>
  try {
    if (localStorage.getItem("zephyr_access_token")) {
      location.replace("/dashboard");
    }
  } catch (e) {}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zephyr — Auto-reply and DM anyone who comments your keyword</title>
<meta name="description" content="Set a keyword on any Instagram post. The moment someone comments it, Zephyr replies and DMs them automatically." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tailwind.css" />
</head>
<body class="min-h-screen bg-bg font-body text-ink antialiased">

<main class="flex min-h-screen items-center justify-center px-6 py-14 sm:px-10">
  <section class="relative w-full max-w-3xl overflow-hidden bg-landing-glow text-center">
    <div class="mx-auto max-w-3xl">

      <!-- logo — the actual anchor of the page, sized like one -->
      <a href="/" class="inline-flex flex-col items-center gap-1.5" aria-label="Zephyr">
        <span class="inline-flex items-center gap-2.5">
          <img src="/assets/zephyr-logo.png" alt="" data-fallback class="h-14 w-14 flex-none object-contain" />
          <svg width="52" height="52" viewBox="0 0 26 26" fill="none" aria-hidden="true" class="hidden [filter:drop-shadow(0_0_6px_rgba(255,46,224,0.45))]">
            <path d="M2 9.5C6 9.5 6 5 11 5c3.6 0 3.6 3 6.4 3 2.4 0 2.4-2 4.6-2" stroke="#FF2EE0" stroke-width="2" stroke-linecap="round"/>
            <path d="M2 14.5C7 14.5 7 18.5 12.5 18.5c4 0 4-3.2 7.2-3.2 2.6 0 2.6 2.2 4.8 2.2" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <img src="/assets/zephyr-font.png" alt="Zephyr" data-fallback class="h-9 w-auto object-contain" />
          <span class="hidden font-display text-4xl font-bold text-ink">Zephyr</span>
        </span>
        <span class="font-mono text-[10px] uppercase tracking-[0.14em] text-ink-faint">
          Instagram comment automation
        </span>
      </a>

      <h1 class="mx-auto mt-7 max-w-xl font-display text-[clamp(1.8rem,4.5vw,2.7rem)] font-bold leading-[1.14] tracking-tight text-ink [text-shadow:0_0_24px_rgba(0,240,255,0.2)]">
        Automatically reply and DM anyone who comments a keyword on your post.
      </h1>

      <!-- ===== the whole mechanism, in one glance ===== -->
      <div id="workflowRow" class="mx-auto mt-8 flex max-w-xl flex-col items-stretch gap-2.5 sm:flex-row sm:items-center sm:justify-center sm:gap-3">
        <div data-chip class="flex-1 rounded-md border px-4 py-2.5 text-left text-sm transition-colors duration-500 sm:text-center">
          <span class="block font-mono text-[10.5px] uppercase tracking-wide text-ink-faint">1 · They comment</span>
          <span class="mt-0.5 block font-medium text-ink">"GUIDE" on your post</span>
        </div>
        <span class="hidden font-display text-lg text-ink-faint sm:block" aria-hidden="true">→</span>
        <span class="block text-center font-display text-lg text-ink-faint sm:hidden" aria-hidden="true">↓</span>
        <div data-chip class="flex-1 rounded-md border px-4 py-2.5 text-left text-sm transition-colors duration-500 sm:text-center">
          <span class="block font-mono text-[10.5px] uppercase tracking-wide text-ink-faint">2 · Zephyr matches it</span>
          <span class="mt-0.5 block font-medium text-ink">Instantly, in real time</span>
        </div>
        <span class="hidden font-display text-lg text-ink-faint sm:block" aria-hidden="true">→</span>
        <span class="block text-center font-display text-lg text-ink-faint sm:hidden" aria-hidden="true">↓</span>
        <div data-chip class="flex-1 rounded-md border px-4 py-2.5 text-left text-sm transition-colors duration-500 sm:text-center">
          <span class="block font-mono text-[10.5px] uppercase tracking-wide text-ink-faint">3 · They get it</span>
          <span class="mt-0.5 block font-medium text-ink">Zephyr's DM + optional reply</span>
        </div>
      </div>

      <!-- ===== the one button on this page ===== -->
      <div class="mt-8 flex flex-col items-center gap-3">
        <button
          id="connectBtn"
          disabled
          class="inline-flex items-center justify-center gap-2 rounded-md bg-accent px-6 py-[13px] font-display text-[15px] font-semibold text-[#150014] shadow-glow-accent transition duration-150 hover:-translate-y-px hover:bg-accent-deep hover:shadow-glow-accent-lg disabled:pointer-events-none disabled:opacity-40 disabled:shadow-none"
        >
          <img src="/assets/instagram-logo.png" alt="" data-fallback class="h-[18px] w-[18px] flex-none object-contain" />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden h-[18px] w-[18px] flex-none" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
          </svg>
          Login with Instagram
        </button>

        <!-- the ONLY privacy-policy link on this page -->
        <label class="flex cursor-pointer items-start gap-2 text-left font-mono text-[12px] tracking-wide text-ink-faint">
          <input type="checkbox" id="privacyConsent" class="mt-0.5 h-3.5 w-3.5 flex-none cursor-pointer accent-teal" />
          <span>
            I agree to the
            <a href="/privacy-policy" target="_blank" rel="noopener" class="text-teal hover:underline">Privacy Policy</a>
          </span>
        </label>

        <!-- pricing — text set by landing.ts from config.ts's PRICE_DISPLAY -->
        <span id="priceLabel" class="font-mono text-[12px] tracking-wide text-ink-faint"></span>
      </div>
    </div>
  </section>
</main>

<!-- ============ FOOTER — no privacy-policy link (already above, once) ============ -->
<footer class="border-t border-line/60 px-6 py-7 sm:px-10">
  <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-4 sm:flex-row">
    <p class="font-mono text-xs text-ink-faint">© 2026 Zephyr. All rights reserved.</p>
    <a href="mailto:support@zephyr-m5w7.onrender.com" class="font-mono text-xs tracking-wide text-ink-faint transition hover:text-ink-soft">Contact</a>
  </div>
</footer>

<script type="module" src="/js/asset-fallback.js"></script>
<script type="module" src="/js/landing.js"></script>
</body>
</html>
