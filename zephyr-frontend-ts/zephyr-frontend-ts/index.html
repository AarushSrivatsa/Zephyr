<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zephyr — Turn Instagram comments into DMs, automatically</title>
<meta name="description" content="Set a catchphrase on any post. When someone comments it, Zephyr sends them a DM instantly — no manual follow-up." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>
  /* ---- minimal landing-only styles ---- */
  html, body{ height: 100%; }
  body{
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 20% 15%, rgba(255, 46, 224, 0.10), transparent 45%),
      radial-gradient(circle at 82% 78%, rgba(0, 240, 255, 0.10), transparent 45%),
      var(--bg);
  }

  .minimal-wrap{
    text-align: center;
    padding: 32px;
  }

  .wordmark{
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 30px;
    letter-spacing: -0.02em;
    text-decoration: none;
    color: var(--ink);
    text-shadow: 0 0 24px rgba(0, 240, 255, 0.25);
  }
  .wordmark svg{ flex: none; filter: drop-shadow(0 0 6px rgba(255, 46, 224, 0.45)); }

  .tagline{
    margin: 14px 0 32px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    letter-spacing: .04em;
    color: var(--ink-faint);
  }

  .cta-row{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }
</style>
</head>
<body>

<div class="minimal-wrap">
  <a class="wordmark" href="index.html" aria-label="Zephyr">
    <svg width="30" height="30" viewBox="0 0 26 26" fill="none" aria-hidden="true">
      <path d="M2 9.5C6 9.5 6 5 11 5c3.6 0 3.6 3 6.4 3 2.4 0 2.4-2 4.6-2" stroke="#FF2EE0" stroke-width="2" stroke-linecap="round"/>
      <path d="M2 14.5C7 14.5 7 18.5 12.5 18.5c4 0 4-3.2 7.2-3.2 2.6 0 2.6 2.2 4.8 2.2" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
    </svg>
    Zephyr
  </a>
  <p class="tagline">Turn Instagram comments into DMs, automatically.</p>
  <div class="cta-row">
    <button class="btn btn-accent" id="navConnectBtn">Login with Instagram</button>
    <a href="dashboard.html" class="btn btn-ghost btn-sm" id="navDashboardLink" style="display:none;">Dashboard</a>
  </div>
</div>

<script type="module" src="js/landing.js"></script>
</body>
</html>
